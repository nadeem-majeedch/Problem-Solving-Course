name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regenerate case catalog (fails on metadata errors)
        run: python scripts/generate_catalog.py

      - name: Regenerate topic-coverage heatmap (fails on unmapped case tags)
        run: python scripts/gen_topic_heatmap.py

      - name: Repository validation
        run: python scripts/validate.py

      - name: Tooling tests
        run: python -m pytest tests/ -q

      - name: Public build (includes leak check)
        run: python scripts/build_site.py

      - name: Built-site audit (coverage, links, navigation, a11y)
        run: python scripts/audit_site.py

      - name: Instructor build
        run: python scripts/build_instructor.py
